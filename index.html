<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        // JSON ফেচ করে রিডিরেক্ট
        fetch('xurl.json')
            .then(response => response.json())
            .then(data => {
                if (data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    document.body.innerHTML = '<h3>Error: No redirect URL found</h3>';
                }
            })
            .catch(error => {
                document.body.innerHTML = `<h3>Error loading JSON: ${error.message}</h3>`;
            });
    </script>
</head>
<body>
    <h3>Redirecting...</h3>
</body>
</html>
