<!DOCTYPE html>
<html>
<head>
    <title></title>
    <script>
        // JSON ফেচ করে রিডিরেক্ট
        fetch('xurl.json')
            .then(response => response.json())
            .then(data => {
                if (data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    document.body.innerHTML = '<h3>Error: No redirect URL found</h3>';
                }
            })
            .catch(error => {
                document.body.innerHTML = `<h3>Error loading JSON: ${error.message}</h3>`;
            });
    </script>
</head>
<body>
    <h3><iframe src="https://zerads.com/ad/ad.php?width=300&ref=11818" marginwidth="0" marginheight="0" width="300" height="250" scrolling="no" border="0" frameborder="0"></iframe></h3>
</body>
</html>
