<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'xurl.json', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var data = JSON.parse(xhr.responseText);
                window.location.href = data.redirectUrl;
            }
        };
        xhr.send();
    </script>
</head>
<body>
    <h3>Loading...</h3>
</body>
</html>
